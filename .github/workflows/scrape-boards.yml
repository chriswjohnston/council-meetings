name: Scrape Boards & Committees
on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 6 AM UTC
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scrape_boards.py'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout docs branch (GitHub Pages source)
        uses: actions/checkout@v4.2.2
        with:
          ref: docs
          fetch-depth: 0

      - name: Checkout scrape_boards.py from main
        run: git show main:scrape_boards.py > scrape_boards.py

      - uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run board scraper
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scrape_boards.py
        # writes to boards/ inside the docs branch checkout

      - name: Commit and push to docs branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add boards/
          git diff --staged --quiet && echo "No changes to commit" || (
            git commit -m "Boards update: $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase origin docs
            git push origin docs
          )
