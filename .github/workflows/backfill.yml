name: Backfill — Rebuild All Council Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pdfminer.six

      - name: Run council scraper
        env:
          BRANCH: public
        run: python scraper.py

      - name: Run build_index
        run: python build_index.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage docs/ AND any state files the scraper touched
          git add docs/ state.json html_page_cache.json summaries.json || true

          git diff --staged --quiet && echo "No changes to commit" || (
            git commit -m "Backfill: rebuild all council pages $(date +'%Y-%m-%d')"
            git pull --rebase --autostash origin main
            git push origin main
          )
